# nginx для otelier — приложение на :80 (default_server ловит app-домен и голый ip).
# tls терминирует cloudflare (проксирование), origin отдаёт http.

server {
    listen 80 default_server;
    server_name _;

    # liveness проверка бэкенда.
    location = /api/health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # проксирование API. без '/' в конце proxy_pass -> исходный URI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # статический хостинг SPA.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
