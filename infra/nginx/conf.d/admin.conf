# админ-spa на отдельном поддомене. на :80 матчится по server_name (прод за cloudflare),
# на :8081 — единственный блок на порту, поэтому отдаёт админку локально (http://localhost:8081).
# тот же бэкенд (эндпоинты /api/v1/admin/*, кука admin_session).

server {
    listen 80;
    listen 8081;
    server_name otelier-admin.rkochetov.com;

    # тот же бэкенд; админка ходит в /api/v1/admin/* со своей кукой admin_session.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # статика админ-spa (отдельная сборка) с откатом на клиентский роутинг.
    location / {
        root /usr/share/nginx/admin;
        try_files $uri $uri/ /index.html;
    }
}
