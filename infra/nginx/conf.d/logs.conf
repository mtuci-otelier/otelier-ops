# просмотрщик логов (dozzle) на отдельном поддомене otelier-logs, закрыт basic-auth.
# upstream резолвится лениво (resolver docker dns + переменная), поэтому nginx стартует
# даже когда контейнера dozzle нет (локальный стек без прод-оверлея).

server {
    listen 80;
    server_name otelier-logs.rkochetov.com;

    # встроенный dns docker — резолвит имя сервиса в рантайме, а не при старте.
    resolver 127.0.0.11 valid=30s;

    auth_basic "otelier logs";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        set $dozzle_upstream dozzle:8080;
        proxy_pass http://$dozzle_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # dozzle использует server-sent events для стрима логов.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 24h;
    }
}
